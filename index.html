<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>서천 발음 배틀킹</title>
    <style>
        :root {
            --primary: #4a90e2;
            --bg: #f4f7f6;
            --card-bg: #ffffff;
            --text: #333333;
            --accent: #ff6b6b;
        }

        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background-color: var(--card-bg);
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            width: 100%;
            max-width: 500px;
            padding: 25px;
            text-align: center;
        }

        .title {
            color: var(--accent);
            margin-bottom: 5px;
            font-size: 1.8rem;
        }

        .subtitle {
            color: #666;
            font-size: 0.9rem;
            margin-top: 0;
            margin-bottom: 20px;
        }

        .timer-box {
            background-color: #fff3bf;
            border: 1px solid #ffe066;
            border-radius: 12px;
            padding: 10px 20px;
            font-weight: bold;
            font-size: 1.1rem;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .score-box {
            font-size: 1rem;
            color: #d9480f;
            font-weight: bold;
        }

        .pin-input {
            width: 100px;
            text-align: center;
            padding: 5px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 0.9rem;
        }

        .word-card {
            background: #fff0f6;
            border: 2px solid #ffdeeb;
            border-radius: 16px;
            padding: 25px 15px;
            margin-bottom: 20px;
            transition: background-color 0.2s;
        }

        .word-card.correct {
            background-color: #d3f9d8;
            border-color: #b2f2bb;
        }

        .hanzi {
            font-size: 2.5rem;
            font-weight: bold;
            margin: 0;
            color: #1c7ed6;
        }

        .pinyin {
            font-size: 1.4rem;
            color: var(--accent);
            font-weight: 600;
            margin: 8px 0 4px 0;
        }

        .meaning {
            color: #868e96;
            margin: 0;
            font-size: 0.95rem;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 15px;
        }

        .btn {
            border: none;
            padding: 10px 16px;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.1s, opacity 0.2s;
            font-size: 0.9rem;
        }

        .btn:active {
            transform: scale(0.96);
        }

        .btn-audio {
            background-color: #74c0fc;
            color: white;
        }

        .btn-next {
            background-color: #adb5bd;
            color: white;
        }

        .btn-start {
            background-color: #ff6b6b;
            color: white;
            width: 100%;
            padding: 15px;
            font-size: 1.2rem;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(255, 107, 107, 0.3);
            margin-bottom: 20px;
        }

        .feedback-box {
            border: 1px solid #e9ecef;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 20px;
            background-color: #f8f9fa;
        }

        .feedback-title {
            font-size: 0.85rem;
            color: #495057;
            margin-bottom: 10px;
            font-weight: bold;
        }

        .feedback-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            font-size: 0.9rem;
        }

        .feedback-item {
            background: white;
            padding: 8px;
            border-radius: 8px;
            border: 1px solid #dee2e6;
        }

        .feedback-label {
            display: block;
            font-size: 0.75rem;
            color: #868e96;
            margin-bottom: 3px;
        }

        .ranking-box {
            border: 1px solid #ffe066;
            background-color: #fff9db;
            border-radius: 12px;
            padding: 15px;
        }

        .ranking-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .ranking-title {
            font-weight: bold;
            color: #f59f00;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .btn-award {
            background-color: #fcc419;
            border: none;
            padding: 5px 10px;
            border-radius: 8px;
            color: white;
            font-weight: bold;
            font-size: 0.8rem;
            cursor: pointer;
        }

        .ranking-list {
            padding-left: 20px;
            margin: 0;
            text-align: left;
            font-size: 0.9rem;
        }

        .ranking-item {
            display: flex;
            justify-content: space-between;
            padding: 6px 0;
            border-bottom: 1px dashed #ffe066;
        }

        .ranking-item:last-child {
            border-bottom: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2 class="title">🏫 서천 발음 배틀킹</h2>
        <p class="subtitle">1분 연속 발음 평가 모드</p>

        <div class="timer-box">
            <span>⏱️ 남은 시간: <span id="timer">01:00</span></span>
            <span class="score-box">점수: <span id="score">0</span>점</span>
            <input type="text" id="username" class="pin-input" placeholder="이름(학번)">
        </div>

        <div class="word-card" id="wordCard">
            <h1 class="hanzi" id="hanzi">星期一</h1>
            <p class="pinyin" id="pinyin">Xīngqī yī</p>
            <p class="meaning" id="meaning">월요일</p>
        </div>

        <div class="btn-group">
            <button class="btn btn-audio" onclick="playAudio()">🔊 원어민 듣기</button>
            <button class="btn btn-next" onclick="nextWord()">🎲 다른 문제</button>
        </div>

        <button class="btn btn-start" id="startBtn" onclick="toggleGame()">🎤 1분 도전 시작!</button>

        <div class="feedback-box">
            <div class="feedback-title">🔍 한어병음(Pinyin) 비교 피드백</div>
            <div class="feedback-grid">
                <div class="feedback-item">
                    <span class="feedback-label">목표 병음</span>
                    <strong id="targetPinyin">Xīngqī yī</strong>
                </div>
                <div class="feedback-item">
                    <span class="feedback-label">인식된 병음</span>
                    <strong id="recognizedPinyin">-</strong>
                </div>
            </div>
        </div>

        <div class="ranking-box">
            <div class="ranking-header">
                <span class="ranking-title">🏆 학급 실시간 랭킹 (Top 5)</span>
                <button class="btn-award" onclick="triggerConfetti()">🎉 팡파레 시상</button>
            </div>
            <ol class="ranking-list" id="rankingList">
                <li class="ranking-item"><span>홍길동</span><strong>120점</strong></li>
                <li class="ranking-item"><span>김철수</span><strong>100점</strong></li>
                <li class="ranking-item"><span>이영희</span><strong>80점</strong></li>
                <li class="ranking-item"><span>박민수</span><strong>60점</strong></li>
                <li class="ranking-item"><span>최지우</span><strong>40점</strong></li>
            </ol>
        </div>
    </div>

    <script>
        const wordList = [
            { hanzi: "星期一", pinyin: "Xīngqī yī", meaning: "월요일" },
            { hanzi: "星期二", pinyin: "Xīngqī èr", meaning: "화요일" },
            { hanzi: "星期三", pinyin: "Xīngqī sān", meaning: "수요일" },
            { hanzi: "星期四", pinyin: "Xīngqī sì", meaning: "목요일" },
            { hanzi: "星期五", pinyin: "Xīngqī wǔ", meaning: "금요일" },
            { hanzi: "星期六", pinyin: "Xīngqī liù", meaning: "토요일" },
            { hanzi: "星期日", pinyin: "Xīngqī rì", meaning: "일요일" }
        ];

        let currentIndex = 0;
        let isPlaying = false;
        let timerInterval = null;
        let timeLeft = 60;
        let score = 0;
        let isChecking = false; // 정답 처리 중 중복 방지

        let rankings = [
            { name: "홍길동", score: 120 },
            { name: "김철수", score: 100 },
            { name: "이영희", score: 80 },
            { name: "박민수", score: 60 },
            { name: "최지우", score: 40 }
        ];

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition = null;

        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.lang = 'zh-CN';
            recognition.continuous = true;
            recognition.interimResults = true;

            recognition.onresult = (event) => {
                if (!isPlaying || isChecking) return;

                let currentTranscript = '';
                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    currentTranscript += event.results[i][0].transcript;
                }
                
                const cleanSpeech = currentTranscript.replace(/\s+/g, '').toLowerCase();
                if (cleanSpeech !== '') {
                    document.getElementById('recognizedPinyin').innerText = currentTranscript;
                    checkAnswer(cleanSpeech);
                }
            };

            recognition.onerror = (event) => {
                console.error("음성 인식 오류:", event.error);
            };

            recognition.onend = () => {
                if (isPlaying && timeLeft > 0) {
                    try { recognition.start(); } catch(e) {}
                }
            };
        }

        // 정답 검사 및 자동으로 다음 문제 전환
        function checkAnswer(speech) {
            const currentWord = wordList[currentIndex];
            const targetHanzi = currentWord.hanzi.replace(/\s+/g, '').toLowerCase();
            
            // 한자가 인식 음성에 포함되어 있는지 확인
            if (speech.includes(targetHanzi)) {
                isChecking = true;
                score += 20; // 20점 추가
                document.getElementById('score').innerText = score;

                // 정답 피드백 효과 (카드 초록색 반짝)
                const card = document.getElementById('wordCard');
                card.classList.add('correct');

                setTimeout(() => {
                    card.classList.remove('correct');
                    nextWord();
                    isChecking = false;
                }, 400); // 0.4초 후 다음 문제 전환
            }
        }

        function playAudio() {
            const currentWord = wordList[currentIndex];
            const utterance = new SpeechSynthesisUtterance(currentWord.hanzi);
            utterance.lang = 'zh-CN';
            window.speechSynthesis.speak(utterance);
        }

        function nextWord() {
            let nextIndex = Math.floor(Math.random() * wordList.length);
            // 같은 문제가 연속으로 나오지 않도록 방지
            if (wordList.length > 1 && nextIndex === currentIndex) {
                nextIndex = (currentIndex + 1) % wordList.length;
            }
            currentIndex = nextIndex;

            const word = wordList[currentIndex];
            document.getElementById('hanzi').innerText = word.hanzi;
            document.getElementById('pinyin').innerText = word.pinyin;
            document.getElementById('meaning').innerText = word.meaning;
            document.getElementById('targetPinyin').innerText = word.pinyin;
            document.getElementById('recognizedPinyin').innerText = '-';
        }

        function toggleGame() {
            const startBtn = document.getElementById('startBtn');

            if (!isPlaying) {
                isPlaying = true;
                timeLeft = 60;
                score = 0;
                document.getElementById('score').innerText = score;
                startBtn.innerText = "⏹️ 도전 중단";
                startBtn.style.backgroundColor = "#e03131";
                
                nextWord();

                if (recognition) {
                    try { recognition.start(); } catch(e) {}
                }
                
                timerInterval = setInterval(() => {
                    timeLeft--;
                    updateTimerDisplay();

                    if (timeLeft <= 0) {
                        endGame();
                    }
                }, 1000);
            } else {
                endGame();
            }
        }

        function endGame() {
            isPlaying = false;
            clearInterval(timerInterval);
            if (recognition) recognition.stop();
            
            const startBtn = document.getElementById('startBtn');
            startBtn.innerText = "🎤 1분 도전 시작!";
            startBtn.style.backgroundColor = "#ff6b6b";

            const nameInput = document.getElementById('username').value.trim() || '익명';
            addScoreToRanking(nameInput, score);
            alert(`⏰ 시간이 종료되었습니다!\n최종 점수: ${score}점`);
        }

        function updateTimerDisplay() {
            const minutes = String(Math.floor(timeLeft / 60)).padStart(2, '0');
            const seconds = String(timeLeft % 60).padStart(2, '0');
            document.getElementById('timer').innerText = `${minutes}:${seconds}`;
        }

        function addScoreToRanking(name, newScore) {
            rankings.push({ name: name, score: newScore });
            rankings.sort((a, b) => b.score - a.score);
            updateRankingDisplay();
        }

        function updateRankingDisplay() {
            const rankingListEl = document.getElementById('rankingList');
            rankingListEl.innerHTML = '';

            const top5 = rankings.slice(0, 5);

            top5.forEach((rank) => {
                const li = document.createElement('li');
                li.className = 'ranking-item';
                li.innerHTML = `<span>${rank.name}</span><strong>${rank.score}점</strong>`;
                rankingListEl.appendChild(li);
            });

            for (let i = top5.length; i < 5; i++) {
                const li = document.createElement('li');
                li.className = 'ranking-item';
                li.innerHTML = `<span>-</span><strong>0점</strong>`;
                rankingListEl.appendChild(li);
            }
        }

        function triggerConfetti() {
            alert("🎉 축하합니다!");
        }

        updateRankingDisplay();
    </script>
</body>
</html>
