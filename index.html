<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🇨🇳 중국어 발음 낙하 스피드 배틀</title>
    <style>
        :root { --main-color: #ff4757; --bg-color: #f1f2f6; }
        body { font-family: 'Pretendard', -apple-system, sans-serif; background-color: var(--bg-color); margin: 0; padding: 15px; display: flex; justify-content: center; }
        .container { background: white; width: 100%; max-width: 480px; border-radius: 20px; padding: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); text-align: center; }
        h1 { color: var(--main-color); margin-bottom: 5px; font-size: 24px; }
        .subtitle { color: #747d8c; font-size: 14px; margin-bottom: 10px; }
        
        /* ⏱️ 게임 헤더 (타이머 & 점수) */
        .game-header { display: flex; justify-content: space-between; background: #ffeaa7; border: 2px solid #fdcb6e; border-radius: 12px; padding: 10px 15px; font-size: 18px; font-weight: bold; color: #2d3436; margin-bottom: 15px; }
        .timer-val { color: #d63031; }
        .score-val { color: #0984e3; }

        .user-setup { display: flex; gap: 8px; margin-bottom: 15px; }
        input[type="text"] { flex: 1; padding: 12px; border: 2px solid #ddd; border-radius: 10px; font-size: 16px; outline: none; }
        
        /* 🎮 단어 낙하 게임 스테이지 */
        .game-stage { position: relative; width: 100%; height: 260px; background: #2d3436; border-radius: 15px; overflow: hidden; border: 3px solid #636e72; margin-bottom: 15px; }
        
        /* 떨어지는 단어 카트 */
        .falling-card { position: absolute; left: 50%; transform: translateX(-50%); background: #ffffff; border: 3px solid #ff4757; border-radius: 12px; padding: 10px 20px; text-align: center; box-shadow: 0 5px 15px rgba(0,0,0,0.3); transition: top 0.1s linear; }
        .falling-card.hit { animation: popOut 0.4s forwards; border-color: #2ed573; background: #e8fae8; }
        .falling-hanzi { font-size: 36px; font-weight: bold; color: #2d3436; }
        .falling-pinyin { font-size: 18px; color: #ff4757; font-weight: bold; }
        .falling-meaning { font-size: 14px; color: #636e72; }

        .btn-rec { background-color: var(--main-color); color: white; width: 100%; font-size: 18px; padding: 15px; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; }
        .btn-rec.recording { background-color: #2ed573; animation: blink 1s infinite; }

        .feedback-card { background: #ffffff; border: 2px solid #e2e8f0; border-radius: 12px; padding: 12px; margin-top: 15px; text-align: left; }
        .compare-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; text-align: center; }
        .compare-box { background: #f8fafc; padding: 8px; border-radius: 8px; border: 1px solid #cbd5e1; }
        .compare-label { font-size: 11px; color: #64748b; }
        .compare-val { font-size: 18px; font-weight: bold; color: #0f172a; }

        .leaderboard { background: #ffffff; border: 1px solid #eccc68; border-radius: 12px; padding: 15px; text-align: left; margin-top: 15px; }
        .leaderboard-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .leaderboard h3 { margin: 0; color: #ffa502; font-size: 16px; }
        .rank-list { list-style: none; padding: 0; margin: 0; max-height: 150px; overflow-y: auto; }
        .rank-item { display: flex; justify-content: space-between; padding: 8px; border-bottom: 1px solid #f1f2f6; font-size: 14px; }
        .rank-item:nth-child(1) { font-weight: bold; color: #ffa502; background: #fffaf0; border-radius: 6px; }

        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; } }
        @keyframes popOut { 0% { transform: translateX(-50%) scale(1); } 50% { transform: translateX(-50%) scale(1.3); } 100% { transform: translateX(-50%) scale(0); opacity: 0; } }
    </style>
</head>
<body>

<div class="container">
    <h1>🇨🇳 발음 배틀 킹</h1>
    <div class="subtitle">2분 스피드 단어 맞히기 게임</div>

    <div class="game-header">
        <div>⏱️ 시간: <span class="timer-val" id="timerDisplay">02:00</span></div>
        <div>🏆 점수: <span class="score-val" id="scoreDisplay">0점</span></div>
    </div>

    <div class="user-setup">
        <input type="text" id="studentName" placeholder="이름(학번)을 입력하세요" />
    </div>

    <!-- 🎮 단어가 내려오는 게임 화면 -->
    <div class="game-stage" id="stage">
        <div class="falling-card" id="fallingCard" style="top: -150px;">
            <div class="falling-hanzi" id="displayHanzi">一月</div>
            <div class="falling-pinyin" id="displayPinyin">Yī yuè</div>
            <div class="falling-meaning" id="displayMeaning">1월</div>
        </div>
    </div>

    <button id="recBtn" class="btn-rec" onclick="toggleGame()">🎮 2분 게임 시작!</button>

    <div class="feedback-card">
        <div class="compare-grid">
            <div class="compare-box">
                <div class="compare-label">목표 병음</div>
                <div class="compare-val" id="targetPinyinBox">Yī yuè</div>
            </div>
            <div class="compare-box">
                <div class="compare-label">인식된 병음</div>
                <div class="compare-val" id="userPinyinBox">-</div>
            </div>
        </div>
        <div id="feedbackText" style="font-size:13px; text-align:center; margin-top:6px; font-weight:bold;"></div>
    </div>

    <div class="leaderboard">
        <div class="leaderboard-header">
            <h3>🏆 학급 실시간 랭킹</h3>
            <button style="background:#ffa502; color:white; border:none; padding:5px 10px; border-radius:5px; cursor:pointer;" onclick="playFanfareAndClap()">🎉 팡파레 시상</button>
        </div>
        <ul class="rank-list" id="rankList">
            <li class="rank-item"><span>-</span><span>0점</span></li>
        </ul>
    </div>
</div>

<script>
    const charPinyinMap = {
        "一": "Yī", "二": "Èr", "三": "Sān", "四": "Sì", "五": "Wǔ",
        "六": "Liù", "七": "Qī", "八": "Bā", "九": "Jiǔ", "十": "Shí",
        "月": "yuè", "星": "Xīng", "期": "qī", "日": "rì",
        "1": "Yī", "2": "Èr", "3": "Sān", "4": "Sì", "5": "Wǔ",
        "6": "Liù", "7": "Qī", "8": "Bā", "9": "Jiǔ", "10": "Shí"
    };

    const pinyinMap = {
        "一月": "Yī yuè", "二月": "Èr yuè", "三月": "Sān yuè", "四月": "Sì yuè",
        "五月": "Wǔ yuè", "六月": "Liù yuè", "七月": "Qī yuè", "八月": "Bā yuè",
        "九月": "Jiǔ yuè", "十月": "Shí yuè", "十一月": "Shí yī yuè", "十二月": "Shí èr yuè",
        "星期一": "Xīngqī yī", "星期二": "Xīngqī èr", "星期三": "Xīngqī sān",
        "星期四": "Xīngqī sì", "星期五": "Xīngqī wǔ", "星期六": "Xīngqī liù", "星期日": "Xīngqī rì",
        "1月": "Yī yuè", "2月": "Èr yuè", "3月": "Sān yuè", "4月": "Sì yuè", "5月": "Wǔ yuè"
    };

    const vocabulary = [
        { hanzi: "一月", pinyin: "Yī yuè", meaning: "1월" },
        { hanzi: "二月", pinyin: "Èr yuè", meaning: "2월" },
        { hanzi: "三月", pinyin: "Sān yuè", meaning: "3월" },
        { hanzi: "四月", pinyin: "Sì yuè", meaning: "4월" },
        { hanzi: "五月", pinyin: "Wǔ yuè", meaning: "5월" },
        { hanzi: "六月", pinyin: "Liù yuè", meaning: "6월" },
        { hanzi: "七月", pinyin: "Qī yuè", meaning: "7월" },
        { hanzi: "八月", pinyin: "Bā yuè", meaning: "8월" },
        { hanzi: "九月", pinyin: "Jiǔ yuè", meaning: "9월" },
        { hanzi: "十月", pinyin: "Shí yuè", meaning: "10월" },
        { hanzi: "十一月", pinyin: "Shí yī yuè", meaning: "11월" },
        { hanzi: "十二月", pinyin: "Shí èr yuè", meaning: "12월" },
        { hanzi: "星期一", pinyin: "Xīngqī yī", meaning: "월요일" },
        { hanzi: "星期二", pinyin: "Xīngqī èr", meaning: "화요일" },
        { hanzi: "星期三", pinyin: "Xīngqī sān", meaning: "수요일" },
        { hanzi: "星期四", pinyin: "Xīngqī sì", meaning: "목요일" },
        { hanzi: "星期五", pinyin: "Xīngqī wǔ", meaning: "금요일" },
        { hanzi: "星期六", pinyin: "Xīngqī liù", meaning: "토요일" },
        { hanzi: "星期日", pinyin: "Xīngqī rì", meaning: "일요일" }
    ];

    let currentIdx = 0;
    let isGameRunning = false;
    let currentScore = 0;
    let timeLeft = 120;
    let timerInterval = null;
    let fallInterval = null;
    let posY = -120;
    let recognition;
    let rankData = {};

    function playFanfareAndClap() {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const notes = [
            { f: 261.63, dur: 0.15, time: 0 },
            { f: 329.63, dur: 0.15, time: 0.15 },
            { f: 392.00, dur: 0.15, time: 0.30 },
            { f: 523.25, dur: 0.60, time: 0.45 }
        ];

        notes.forEach(note => {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.value = note.f;
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime + note.time);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + note.time + note.dur);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(audioCtx.currentTime + note.time);
            osc.stop(audioCtx.currentTime + note.time + note.dur);
        });
    }

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    if (SpeechRecognition) {
        recognition = new SpeechRecognition();
        recognition.lang = 'zh-CN';
        recognition.continuous = false;
        recognition.interimResults = false;

        recognition.onresult = (event) => {
            const rawSpoken = event.results[0][0].transcript.replace(/\s+/g, '');
            evaluatePronunciation(rawSpoken);
        };

        recognition.onerror = () => {
            if (isGameRunning) setTimeout(() => { safeStartRec(); }, 300);
        };

        recognition.onend = () => {
            if (isGameRunning) setTimeout(() => { safeStartRec(); }, 200);
        };
    }

    function safeStartRec() {
        if (!isGameRunning) return;
        try { recognition.start(); } catch(e) {}
    }

    function toggleGame() {
        const nameInput = document.getElementById('studentName').value.trim();
        if (!nameInput) {
            alert("이름(학번)을 먼저 입력해주세요!");
            return;
        }

        if (!isGameRunning) {
            isGameRunning = true;
            currentScore = 0;
            timeLeft = 120;
            document.getElementById('scoreDisplay').innerText = "0점";
            document.getElementById('recBtn').innerText = "🛑 게임 진행 중... (클릭 시 정지)";
            document.getElementById('recBtn').classList.add('recording');
            
            startTimer();
            spawnNewWord();
            safeStartRec();
        } else {
            stopGame();
        }
    }

    function stopGame() {
        isGameRunning = false;
        clearInterval(timerInterval);
        clearInterval(fallInterval);
        try { recognition.stop(); } catch(e){}
        
        document.getElementById('recBtn').innerText = "🎮 2분 게임 시작!";
        document.getElementById('recBtn').classList.remove('recording');
    }

    function startTimer() {
        updateTimerDisplay();
        clearInterval(timerInterval);
        timerInterval = setInterval(() => {
            timeLeft--;
            updateTimerDisplay();
            if (timeLeft <= 0) {
                stopGame();
                document.getElementById('timerDisplay').innerText = "00:00";
                document.getElementById('feedbackText').innerText = "⏰ 시간 종료! 최종 순위를 확인하세요!";
                playFanfareAndClap();
            }
        }, 1000);
    }

    function updateTimerDisplay() {
        const min = String(Math.floor(timeLeft / 60)).padStart(2, '0');
        const sec = String(timeLeft % 60).padStart(2, '0');
        document.getElementById('timerDisplay').innerText = `${min}:${sec}`;
    }

    function spawnNewWord() {
        currentIdx = Math.floor(Math.random() * vocabulary.length);
        const item = vocabulary[currentIdx];
        
        document.getElementById('displayHanzi').innerText = item.hanzi;
        document.getElementById('displayPinyin').innerText = item.pinyin;
        document.getElementById('displayMeaning').innerText = item.meaning;
        document.getElementById('targetPinyinBox').innerText = item.pinyin;
        document.getElementById('userPinyinBox').innerText = "-";

        const card = document.getElementById('fallingCard');
        card.classList.remove('hit');
        posY = -120;
        card.style.top = posY + "px";

        clearInterval(fallInterval);
        // 단어 내려오는 속도 제어
        fallInterval = setInterval(() => {
            if (!isGameRunning) return;
            posY += 2;
            card.style.top = posY + "px";

            // 바닥에 도달하면 실패 처리 후 다음 단어
            if (posY > 180) {
                document.getElementById('feedbackText').innerText = "💥 단어가 놓쳐 지나갔습니다!";
                document.getElementById('feedbackText').style.color = "#e74c3c";
                spawnNewWord();
            }
        }, 50);
    }

    function cleanStr(str) {
        if (!str) return "";
        return str.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().replace(/\s+/g, "");
    }

    function getPinyin(text) {
        if (!text) return "-";
        if (pinyinMap[text]) return pinyinMap[text];
        let result = "";
        for (let char of text) {
            result += (charPinyinMap[char] || char) + " ";
        }
        return result.trim();
    }

    function evaluatePronunciation(spokenHanzi) {
        if (!isGameRunning) return;

        const targetItem = vocabulary[currentIdx];
        const targetHanzi = targetItem.hanzi;
        const targetPinyin = targetItem.pinyin;
        const userPinyin = getPinyin(spokenHanzi);

        const targetClean = cleanStr(targetPinyin);
        const userClean = cleanStr(userPinyin);

        document.getElementById('userPinyinBox').innerText = userPinyin;

        // 발음 정답 판정 시
        if (spokenHanzi === targetHanzi || targetClean === userClean || userPinyin === targetPinyin) {
            currentScore += 100;
            document.getElementById('scoreDisplay').innerText = `${currentScore}점`;
            document.getElementById('feedbackText').innerText = "🎉 정답! 단어 파괴!";
            document.getElementById('feedbackText').style.color = "#27ae60";

            // 단어 파괴 애니메이션 실행 후 다음 단어 스폰
            const card = document.getElementById('fallingCard');
            card.classList.add('hit');
            clearInterval(fallInterval);
            
            updateRanking(currentScore);

            setTimeout(() => {
                if (isGameRunning) spawnNewWord();
            }, 400);
        } else {
            document.getElementById('feedbackText').innerText = `❌ 오독! [${userPinyin}] 다시 발음해보세요!`;
            document.getElementById('feedbackText').style.color = "#e74c3c";
        }
    }

    function updateRanking(score) {
        const name = document.getElementById('studentName').value.trim();
        if (!rankData[name] || score > rankData[name]) {
            rankData[name] = score;
        }
        const sorted = Object.entries(rankData).sort((a, b) => b[1] - a[1]);
        const listEl = document.getElementById('rankList');
        listEl.innerHTML = '';
        sorted.forEach(([student, pts], idx) => {
            const li = document.createElement('li');
            li.className = 'rank-item';
            li.innerHTML = `<span>${idx + 1}위. ${student}</span><span>${pts}점</span>`;
            listEl.appendChild(li);
        });
    }
</script>
</body>
</html>
