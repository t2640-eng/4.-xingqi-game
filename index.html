<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>서천 발음 배틀킹</title>
    <style>
        :root {
            --primary: #4a90e2;
            --bg: #f4f7f6;
            --card-bg: #ffffff;
            --text: #333333;
            --accent: #ff6b6b;
        }

        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background-color: var(--card-bg);
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            width: 100%;
            max-width: 500px;
            padding: 25px;
            text-align: center;
        }

        .title {
            color: var(--accent);
            margin-bottom: 5px;
            font-size: 1.8rem;
        }

        .subtitle {
            color: #666;
            font-size: 0.9rem;
            margin-top: 0;
            margin-bottom: 20px;
        }

        .timer-box {
            background-color: #fff3bf;
            border: 1px solid #ffe066;
            border-radius: 12px;
            padding: 10px;
            font-weight: bold;
            font-size: 1.1rem;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
        }

        .pin-input {
            width: 60px;
            text-align: center;
            padding: 5px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 0.9rem;
        }

        .word-card {
            background: #fff0f6;
            border: 2px solid #ffdeeb;
            border-radius: 16px;
            padding: 25px 15px;
            margin-bottom: 20px;
        }

        .hanzi {
            font-size: 2.5rem;
            font-weight: bold;
            margin: 0;
            color: #1c7ed6;
        }

        .pinyin {
            font-size: 1.4rem;
            color: var(--accent);
            font-weight: 600;
            margin: 8px 0 4px 0;
        }

        .meaning {
            color: #868e96;
            margin: 0;
            font-size: 0.95rem;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 15px;
        }

        .btn {
            border: none;
            padding: 10px 16px;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.1s, opacity 0.2s;
            font-size: 0.9rem;
        }

        .btn:active {
            transform: scale(0.96);
        }

        .btn-audio {
            background-color: #74c0fc;
            color: white;
        }

        .btn-next {
            background-color: #adb5bd;
            color: white;
        }

        .btn-start {
            background-color: #ff6b6b;
            color: white;
            width: 100%;
            padding: 15px;
            font-size: 1.2rem;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(255, 107, 107, 0.3);
            margin-bottom: 20px;
        }

        .feedback-box {
            border: 1px solid #e9ecef;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 20px;
            background-color: #f8f9fa;
        }

        .feedback-title {
            font-size: 0.85rem;
            color: #495057;
            margin-bottom: 10px;
            font-weight: bold;
        }

        .feedback-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            font-size: 0.9rem;
        }

        .feedback-item {
            background: white;
            padding: 8px;
            border-radius: 8px;
            border: 1px solid #dee2e6;
        }

        .feedback-label {
            display: block;
            font-size: 0.75rem;
            color: #868e96;
            margin-bottom: 3px;
        }

        .ranking-box {
            border: 1px solid #ffe066;
            background-color: #fff9db;
            border-radius: 12px;
            padding: 15px;
        }

        .ranking-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .ranking-title {
            font-weight: bold;
            color: #f59f00;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .btn-award {
            background-color: #fcc419;
            border: none;
            padding: 5px 10px;
            border-radius: 8px;
            color: white;
            font-weight: bold;
            font-size: 0.8rem;
            cursor: pointer;
        }

        .ranking-list {
            list-style: none;
            padding: 0;
            margin: 0;
            text-align: left;
            font-size: 0.9rem;
        }

        .ranking-item {
            display: flex;
            justify-content: space-between;
            padding: 6px 0;
            border-bottom: 1px dashed #ffe066;
        }

        .ranking-item:last-child {
            border-bottom: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2 class="title">🏫 서천 발음 배틀킹</h2>
        <p class="subtitle">1분 연속 발음 평가 모드</p>

        <div class="timer-box">
            <span>⏱️ 남은 시간: <span id="timer">01:00</span></span>
            <input type="text" class="pin-input" placeholder="0000" maxlength="4">
        </div>

        <div class="word-card">
            <h1 class="hanzi" id="hanzi">星期二</h1>
            <p class="pinyin" id="pinyin">Xīngqī èr</p>
            <p class="meaning" id="meaning">화요일</p>
        </div>

        <div class="btn-group">
            <button class="btn btn-audio" onclick="playAudio()">🔊 원어민 듣기</button>
            <button class="btn btn-next" onclick="nextWord()">🎲 다른 문제</button>
        </div>

        <button class="btn btn-start" id="startBtn" onclick="toggleGame()">🎤 1분 도전 시작!</button>

        <div class="feedback-box">
            <div class="feedback-title">🔍 한어병음(Pinyin) 비교 피드백</div>
            <div class="feedback-grid">
                <div class="feedback-item">
                    <span class="feedback-label">목표 병음</span>
                    <strong id="targetPinyin">Xīngqī èr</strong>
                </div>
                <div class="feedback-item">
                    <span class="feedback-label">인식된 병음</span>
                    <strong id="recognizedPinyin">-</strong>
                </div>
            </div>
        </div>

        <div class="ranking-box">
            <div class="ranking-header">
                <span class="ranking-title">🏆 학급 실시간 랭킹</span>
                <button class="btn-award" onclick="triggerConfetti()">🎉 팡파레 시상</button>
            </div>
            <ul class="ranking-list" id="rankingList">
                <li class="ranking-item">
                    <span>-</span>
                    <strong>0점</strong>
                </li>
            </ul>
        </div>
    </div>

    <script>
        // 단어 데이터셋
        const wordList = [
            { hanzi: "星期一", pinyin: "Xīngqī yī", meaning: "월요일" },
            { hanzi: "星期二", pinyin: "Xīngqī èr", meaning: "화요일" },
            { hanzi: "星期三", pinyin: "Xīngqī sān", meaning: "수요일" },
            { hanzi: "星期四", pinyin: "Xīngqī sì", meaning: "목요일" },
            { hanzi: "星期五", pinyin: "Xīngqī wǔ", meaning: "금요일" },
            { hanzi: "星期六", pinyin: "Xīngqī liù", meaning: "토요일" },
            { hanzi: "星期日", pinyin: "Xīngqī rì", meaning: "일요일" }
        ];

        let currentIndex = 1;
        let isPlaying = false;
        let timerInterval = null;
        let timeLeft = 60; // 1분(60초)으로 설정

        // 음성 인식 설정 (Web Speech API)
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition = null;

        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.lang = 'zh-CN';
            recognition.continuous = false;
            recognition.interimResults = false;

            recognition.onresult = (event) => {
                const transcript = event.results[0][0].transcript;
                document.getElementById('recognizedPinyin').innerText = transcript;
            };

            recognition.onerror = (event) => {
                console.error("음성 인식 오류:", event.error);
            };

            recognition.onend = () => {
                if (isPlaying && timeLeft > 0) {
                    recognition.start(); // 게임 진행 중이면 계속 인식
                }
            };
        }

        function playAudio() {
            const currentWord = wordList[currentIndex];
            const utterance = new SpeechSynthesisUtterance(currentWord.hanzi);
            utterance.lang = 'zh-CN';
            window.speechSynthesis.speak(utterance);
        }

        function nextWord() {
            currentIndex = Math.floor(Math.random() * wordList.length);
            const word = wordList[currentIndex];
            document.getElementById('hanzi').innerText = word.hanzi;
            document.getElementById('pinyin').innerText = word.pinyin;
            document.getElementById('meaning').innerText = word.meaning;
            document.getElementById('targetPinyin').innerText = word.pinyin;
            document.getElementById('recognizedPinyin').innerText = '-';
        }

        function toggleGame() {
            const startBtn = document.getElementById('startBtn');

            if (!isPlaying) {
                // 게임 시작
                isPlaying = true;
                timeLeft = 60; // 60초 초기화
                startBtn.innerText = "⏹️ 도전 중단";
                startBtn.style.backgroundColor = "#e03131";
                
                if (recognition) recognition.start();
                
                timerInterval = setInterval(() => {
                    timeLeft--;
                    updateTimerDisplay();

                    if (timeLeft <= 0) {
                        endGame();
                    }
                }, 1000);
            } else {
                // 게임 중단
                endGame();
            }
        }

        function endGame() {
            isPlaying = false;
            clearInterval(timerInterval);
            if (recognition) recognition.stop();
            
            const startBtn = document.getElementById('startBtn');
            startBtn.innerText = "🎤 1분 도전 시작!";
            startBtn.style.backgroundColor = "#ff6b6b";
            alert("시간이 종료되었습니다!");
        }

        function updateTimerDisplay() {
            const minutes = String(Math.floor(timeLeft / 60)).padStart(2, '0');
            const seconds = String(timeLeft % 60).padStart(2, '0');
            document.getElementById('timer').innerText = `${minutes}:${seconds}`;
        }

        function triggerConfetti() {
            alert("🎉 축하합니다!");
        }
    </script>
</body>
</html>
